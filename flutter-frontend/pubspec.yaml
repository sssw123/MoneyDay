publish_to: none
version: 0.1.0+2
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  provider: 6.1.5+1
  go_router: 16.2.4
